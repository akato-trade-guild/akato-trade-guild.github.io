<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あかとのトレードギルド | ノーコードEAジェネレーター</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --buy-color: #10b981;
      --buy-bg: rgba(16, 185, 129, 0.1);
      --sell-color: #f43f5e;
      --sell-bg: rgba(244, 63, 94, 0.1);
      --warning-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    /* タイトルリンクのデザイン */
    header h1 a {
      font-size: 2rem;
      color: var(--accent-color);
      text-decoration: none;
      transition: color 0.2s, opacity 0.2s;
      display: inline-block;
    }

    header h1 a:hover {
      color: #7dd3fc;
      opacity: 0.9;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .panel {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    input[type="number"], select {
      background-color: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="number"]:focus, select:focus {
      border-color: var(--accent-color);
    }

    /* チェックボックスデザイン */
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    /* エントリー条件の親ボックス */
    .condition-box {
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      transition: all 0.3s ease;
    }

    .condition-box.buy {
      border-color: rgba(16, 185, 129, 0.4);
      background-color: var(--buy-bg);
    }

    .condition-box.sell {
      border-color: rgba(244, 63, 94, 0.4);
      background-color: var(--sell-bg);
    }

    .condition-box.disabled {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(1);
    }

    .condition-header {
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .condition-header.buy-title { color: var(--buy-color); }
    .condition-header.sell-title { color: var(--sell-color); }

    .indicator-child-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
    }

    .child-header {
      margin-bottom: 8px;
    }

    .empty-warning {
      background-color: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--warning-color);
      color: var(--warning-color);
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
      font-size: 0.9rem;
      display: none;
    }

    /* ボタン類 */
    .btn-submit {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* コード表示枠 */
    pre {
      background-color: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      color: #e2e8f0;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      max-height: 400px;
    }

    .copy-btn {
      background-color: #334155;
      color: var(--text-main);
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 10px;
      float: right;
    }

    .copy-btn:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <!-- タイトルにホームへのリンクを追加 (hrefの中身を実際のホームURLに変更してください) -->
    <h1><a href="#">あかとのトレードギルド</a></h1>
    <p>ノーコードEAジェネレーター (Ver 2.1 - 完全同期修正版)</p>
  </header>

  <!-- Step 1: 基本パラメーター -->
  <div class="panel">
    <div class="panel-title">1. 基本設定</div>
    <div class="grid-2">
      <div class="form-group">
        <label for="magicNumber">マジックナンバー</label>
        <input type="number" id="magicNumber" value="123456">
      </div>
      <div class="form-group">
        <label for="lots">ロット数</label>
        <input type="number" id="lots" value="0.1" step="0.01">
      </div>
      <div class="form-group">
        <label for="stopLoss">ストップロス (pips / 0で無効)</label>
        <input type="number" id="stopLoss" value="30">
      </div>
      <div class="form-group">
        <label for="takeProfit">テイクプロフィット (pips / 0で無効)</label>
        <input type="number" id="takeProfit" value="60">
      </div>
      <div class="form-group">
        <label for="timeframe">時間軸 (タイムフレーム)</label>
        <select id="timeframe">
          <option value="0">チャート依存 (PERIOD_CURRENT)</option>
          <option value="PERIOD_M1">1分足 (M1)</option>
          <option value="PERIOD_M5">5分足 (M5)</option>
          <option value="PERIOD_M15">15分足 (M15)</option>
          <option value="PERIOD_M30">30分足 (M30)</option>
          <option value="PERIOD_H1">1時間足 (H1)</option>
          <option value="PERIOD_H4">4時間足 (H4)</option>
          <option value="PERIOD_D1">日足 (D1)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="timing">判定タイミング</label>
        <select id="timing">
          <option value="bar">ローソク足確定時 (1号足)</option>
          <option value="tick">毎ティックリアルタイム (0号足)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Step 2: 使用インジケーター選択 -->
  <div class="panel">
    <div class="panel-title">2. 使用するインジケーター</div>
    <div class="grid-2">
      <label class="checkbox-label">
        <input type="checkbox" id="useRSI" onchange="toggleIndicatorMaster('RSI')">
        <span>RSI (相対力指数)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="useSMA" onchange="toggleIndicatorMaster('SMA')">
        <span>SMA (単純移動平均線)</span>
      </label>
    </div>
  </div>

  <!-- Step 3: エントリー条件構築 -->
  <div class="panel">
    <div class="panel-title">3. エントリー条件の設定</div>

    <!-- 🟩 買い条件ボックス -->
    <div class="condition-box buy" id="buyBox">
      <div class="condition-header buy-title">
        <label class="checkbox-label">
          <input type="checkbox" id="buyEnable" checked onchange="updateUI()">
          <span>🟩 買い（BUY）エントリー条件</span>
        </label>
      </div>

      <!-- 子項目: RSI (買い) -->
      <div class="indicator-child-item" id="buyRsiGroup" style="display: none;">
        <div class="child-header">
          <label class="checkbox-label">
            <input type="checkbox" id="buyUseRsi" checked onchange="updateUI()">
            <strong>RSI条件を使用する</strong>
          </label>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>RSI期間</label>
            <input type="number" id="buyRsiPeriod" value="14">
          </div>
          <div class="form-group">
            <label>閾値 (レベル)</label>
            <input type="number" id="buyRsiLevel" value="30">
          </div>
          <div class="form-group">
            <label>判定</label>
            <select id="buyRsiMode">
              <option value="<=">以下で買い (逆張り)</option>
              <option value=">=">以上で買い (順張り)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 子項目: SMA (買い) -->
      <div class="indicator-child-item" id="buySmaGroup" style="display: none;">
        <div class="child-header">
          <label class="checkbox-label">
            <input type="checkbox" id="buyUseSma" checked onchange="updateUI()">
            <strong>SMA条件を使用する</strong>
          </label>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>SMA期間</label>
            <input type="number" id="buySmaPeriod" value="200">
          </div>
          <div class="form-group">
            <label>価格位置関係</label>
            <select id="buySmaMode">
              <option value=">">終値がSMAより上</option>
              <option value="<">終値がSMAより下</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- 🟥 売り条件ボックス -->
    <div class="condition-box sell" id="sellBox">
      <div class="condition-header sell-title">
        <label class="checkbox-label">
          <input type="checkbox" id="sellEnable" checked onchange="updateUI()">
          <span>🟥 売り（SELL）エントリー条件</span>
        </label>
      </div>

      <!-- 子項目: RSI (売り) -->
      <div class="indicator-child-item" id="sellRsiGroup" style="display: none;">
        <div class="child-header">
          <label class="checkbox-label">
            <input type="checkbox" id="sellUseRsi" checked onchange="updateUI()">
            <strong>RSI条件を使用する</strong>
          </label>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>RSI期間</label>
            <input type="number" id="sellRsiPeriod" value="14">
          </div>
          <div class="form-group">
            <label>閾値 (レベル)</label>
            <input type="number" id="sellRsiLevel" value="70">
          </div>
          <div class="form-group">
            <label>判定</label>
            <select id="sellRsiMode">
              <option value=">=">以上で売り (逆張り)</option>
              <option value="<=">以下で売り (順張り)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 子項目: SMA (売り) -->
      <div class="indicator-child-item" id="sellSmaGroup" style="display: none;">
        <div class="child-header">
          <label class="checkbox-label">
            <input type="checkbox" id="sellUseSma" checked onchange="updateUI()">
            <strong>SMA条件を使用する</strong>
          </label>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>SMA期間</label>
            <input type="number" id="sellSmaPeriod" value="200">
          </div>
          <div class="form-group">
            <label>価格位置関係</label>
            <select id="sellSmaMode">
              <option value="<">終値がSMAより下</option>
              <option value=">">終値がSMAより上</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- 警告表示（条件が空のとき） -->
    <div class="empty-warning" id="warningBox">
      ⚠️ 有効になっているエントリー条件の中に、選択されたインジケーターがありません。少なくとも1つのインジケーター条件にチェックを入れてください。
    </div>

    <button style="margin-top:20px;" class="btn-submit" id="generateBtn" onclick="generateEA()">MQL4コードを生成する</button>
  </div>

  <!-- Step 4: コード出力 -->
  <div class="panel">
    <button class="copy-btn" onclick="copyCode()">コードをコピー</button>
    <div class="panel-title">4. 生成されたMQL4コード</div>
    <pre><code id="mqlCode">// ここにコードが生成されます</code></pre>
  </div>
</div>

<script>
// Masterインジケーター切り替え時の処理（親がONになったら子も自動でtrueに復元する）
function toggleIndicatorMaster(type) {
  if (type === 'RSI') {
    const isChecked = document.getElementById('useRSI').checked;
    document.getElementById('buyRsiGroup').style.display = isChecked ? 'block' : 'none';
    document.getElementById('sellRsiGroup').style.display = isChecked ? 'block' : 'none';
    document.getElementById('buyUseRsi').checked = isChecked;
    document.getElementById('sellUseRsi').checked = isChecked;
  } 
  else if (type === 'SMA') {
    const isChecked = document.getElementById('useSMA').checked;
    document.getElementById('buySmaGroup').style.display = isChecked ? 'block' : 'none';
    document.getElementById('sellSmaGroup').style.display = isChecked ? 'block' : 'none';
    document.getElementById('buyUseSma').checked = isChecked;
    document.getElementById('sellUseSma').checked = isChecked;
  }
  updateUI();
}

// UIの状態更新（ガード機能＆スタイルの反映）
function updateUI() {
  const buyEnable = document.getElementById('buyEnable').checked;
  const sellEnable = document.getElementById('sellEnable').checked;

  document.getElementById('buyBox').classList.toggle('disabled', !buyEnable);
  document.getElementById('sellBox').classList.toggle('disabled', !sellEnable);

  const useRSI = document.getElementById('useRSI').checked;
  const useSMA = document.getElementById('useSMA').checked;

  const buyHasCondition = buyEnable && ((useRSI && document.getElementById('buyUseRsi').checked) || (useSMA && document.getElementById('buyUseSma').checked));
  const sellHasCondition = sellEnable && ((useRSI && document.getElementById('sellUseRsi').checked) || (useSMA && document.getElementById('sellUseSma').checked));

  const warningBox = document.getElementById('warningBox');
  const generateBtn = document.getElementById('generateBtn');

  let isValid = true;
  if (!buyEnable && !sellEnable) {
    isValid = false;
  }
  if (buyEnable && !buyHasCondition) isValid = false;
  if (sellEnable && !sellHasCondition) isValid = false;

  if (!isValid) {
    warningBox.style.display = 'block';
    generateBtn.disabled = true;
  } else {
    warningBox.style.display = 'none';
    generateBtn.disabled = false;
  }
}

// MQL4コード生成ロジック
function generateEA() {
  const magic = document.getElementById('magicNumber').value;
  const lots = document.getElementById('lots').value;
  const sl = document.getElementById('stopLoss').value;
  const tp = document.getElementById('takeProfit').value;
  const tf = document.getElementById('timeframe').value;
  const timing = document.getElementById('timing').value;
  const shift = (timing === 'bar') ? '1' : '0';

  const buyEnable = document.getElementById('buyEnable').checked;
  const sellEnable = document.getElementById('sellEnable').checked;
  const useRSI = document.getElementById('useRSI').checked;
  const useSMA = document.getElementById('useSMA').checked;

  let buyConds = [];
  if (buyEnable) {
    if (useRSI && document.getElementById('buyUseRsi').checked) {
      const p = document.getElementById('buyRsiPeriod').value;
      const l = document.getElementById('buyRsiLevel').value;
      const m = document.getElementById('buyRsiMode').value;
      buyConds.push(`iRSI(Symbol(), ${tf}, ${p}, PRICE_CLOSE, ${shift}) ${m} ${l}.0`);
    }
    if (useSMA && document.getElementById('buyUseSma').checked) {
      const p = document.getElementById('buySmaPeriod').value;
      const m = document.getElementById('buySmaMode').value;
      buyConds.push(`iClose(Symbol(), ${tf}, ${shift}) ${m} iMA(Symbol(), ${tf}, ${p}, 0, MODE_SMA, PRICE_CLOSE, ${shift})`);
    }
  }

  let sellConds = [];
  if (sellEnable) {
    if (useRSI && document.getElementById('sellUseRsi').checked) {
      const p = document.getElementById('sellRsiPeriod').value;
      const l = document.getElementById('sellRsiLevel').value;
      const m = document.getElementById('sellRsiMode').value;
      sellConds.push(`iRSI(Symbol(), ${tf}, ${p}, PRICE_CLOSE, ${shift}) ${m} ${l}.0`);
    }
    if (useSMA && document.getElementById('sellUseSma').checked) {
      const p = document.getElementById('sellSmaPeriod').value;
      const m = document.getElementById('sellSmaMode').value;
      sellConds.push(`iClose(Symbol(), ${tf}, ${shift}) ${m} iMA(Symbol(), ${tf}, ${p}, 0, MODE_SMA, PRICE_CLOSE, ${shift})`);
    }
  }

  const buyLogicStr = (buyConds.length > 0) ? buyConds.join(" && ") : "false";
  const sellLogicStr = (sellConds.length > 0) ? sellConds.join(" && ") : "false";

  const code = `//+------------------------------------------------------------------+
//|                                    AkatoTradeGuild_EA.mq4       |
//|                        Generated by あかとのトレードギルド      |
//+------------------------------------------------------------------+
#property copyright "Akato Trade Guild"
#property strict

input double   InpLots        = ${lots};      // ロット数
input int      InpStopLoss    = ${sl};        // ストップロス (pips)
input int      InpTakeProfit  = ${tp};        // テイクプロフィット (pips)
input int      InpMagicNumber = ${magic};   // マジックナンバー

datetime g_lastBarTime = 0;

int OnInit() {
   return(INIT_SUCCEEDED);
}

void OnDeinit(const int reason) {}

void OnTick() {
   ${timing === 'bar' ? `
   // ローソク足確定の判定 (指定タイムフレームの確定足)
   datetime currentBarTime = iTime(Symbol(), ${tf}, 0);
   if(g_lastBarTime == currentBarTime) return;
   g_lastBarTime = currentBarTime;
   ` : ''}

   // ポジションチェック（既にポジションがある場合は処理スキップ）
   if(CountMyOrders() > 0) return;

   double point = MarketInfo(Symbol(), MODE_POINT);
   int digits = (int)MarketInfo(Symbol(), MODE_DIGITS);
   double pipsFactor = (digits == 3 || digits == 5) ? 10.0 : 1.0;

   // エントリー条件判定
   bool isBuy  = ${buyLogicStr};
   bool isSell = ${sellLogicStr};

   // 買い注文処理
   if(isBuy) {
      double slPrice = (InpStopLoss > 0) ? NormalizeDouble(Ask - (InpStopLoss * point * pipsFactor), Digits) : 0;
      double tpPrice = (InpTakeProfit > 0) ? NormalizeDouble(Ask + (InpTakeProfit * point * pipsFactor), Digits) : 0;
      int ticket = OrderSend(Symbol(), OP_BUY, InpLots, Ask, 3, slPrice, tpPrice, "ATG EA BUY", InpMagicNumber, 0, clrGreen);
      if(ticket < 0) {
         Print("BUY注文失敗 Error: ", GetLastError());
      }
   }
   // 売り注文処理
   else if(isSell) {
      double slPrice = (InpStopLoss > 0) ? NormalizeDouble(Bid + (InpStopLoss * point * pipsFactor), Digits) : 0;
      double tpPrice = (InpTakeProfit > 0) ? NormalizeDouble(Bid - (InpTakeProfit * point * pipsFactor), Digits) : 0;
      int ticket = OrderSend(Symbol(), OP_SELL, InpLots, Bid, 3, slPrice, tpPrice, "ATG EA SELL", InpMagicNumber, 0, clrRed);
      if(ticket < 0) {
         Print("SELL注文失敗 Error: ", GetLastError());
      }
   }
}

// 自身のマジックナンバーのポジション数をカウント
int CountMyOrders() {
   int count = 0;
   for(int i = OrdersTotal() - 1; i >= 0; i--) {
      if(OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) {
         if(OrderSymbol() == Symbol() && OrderMagicNumber() == InpMagicNumber) {
            count++;
         }
      }
   }
   return count;
}`;

  document.getElementById('mqlCode').textContent = code;
}

// コードコピー機能
function copyCode() {
  const codeText = document.getElementById('mqlCode').textContent;
  navigator.clipboard.writeText(codeText).then(() => {
    alert('MQL4コードをクリップボードにコピーしました！');
  });
}

// 初期化（ページロード時にマスターと子要素の状態を完全に初期同期する）
toggleIndicatorMaster('RSI');
toggleIndicatorMaster('SMA');
</script>

</body>
</html>

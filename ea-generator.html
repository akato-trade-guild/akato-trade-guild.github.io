<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノーコードEA作成ツール | あかとのトレードギルド</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --accent-blue: #00f0ff;
      --accent-green: #00ff66;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #1f2937;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    header {
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--accent-blue);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.9rem;
      transition: color 0.3s;
    }

    nav a:hover { color: var(--accent-blue); }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.2rem;
      color: var(--accent-blue);
      border-left: 4px solid var(--accent-blue);
      padding-left: 12px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .panel-header {
      font-weight: bold;
      font-size: 1.05rem;
      color: #fff;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* フォーム要素 */
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* 生成ボタン */
    .btn-generate {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn-generate:hover { opacity: 0.9; }

    /* 出力エリア */
    textarea {
      width: 100%;
      height: 380px;
      background: #080c14;
      border: 1px solid var(--border-color);
      color: var(--accent-green);
      font-family: 'Consolas', 'Courier New', monospace;
      padding: 16px;
      border-radius: 8px;
      box-sizing: border-box;
      resize: vertical;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .btn-copy {
      background: var(--accent-green);
      color: #000;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
      margin-top: 60px;
    }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="./index.html" class="logo">あかとの<span>トレードギルド</span></a>
      <nav>
        <a href="./index.html#tools">開発ツール</a>
        <a href="./index.html#blog">開発記</a>
        <a href="./index.html#request">依頼掲示板</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="section-title">⚡ ノーコードMQL4 EAジェネレーター</div>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px;">
      パラメータを設定して「MQL4コードを生成する」を押すだけで、EAのソースコードが完成します。
    </p>

    <!-- 1. 基本設定 -->
    <div class="panel">
      <div class="panel-header">⚙️ 1. 基本パラメーター設定</div>
      
      <div class="form-row">
        <div class="form-group">
          <label>取引ロット数 (Lots)</label>
          <input type="number" id="inpLots" value="0.1" step="0.01">
        </div>
        <div class="form-group">
          <label>マジックナンバー (識別番号)</label>
          <input type="number" id="inpMagic" value="20260828">
        </div>
      </div>
    </div>

    <!-- 2. 判定タイミング（ローソク足確定判定） -->
    <div class="panel">
      <div class="panel-header">⏱️ 2. 判定タイミング設定（実行頻度）</div>
      
      <div class="form-group">
        <label>エントリー判定を行うタイミング</label>
        <select id="inpTimeframe">
          <option value="PERIOD_CURRENT">ティックごと（毎価格更新時）</option>
          <option value="PERIOD_M1">1分足 確定時</option>
          <option value="PERIOD_M5">5分足 確定時</option>
          <option value="PERIOD_M15" selected>15分足 確定時（推奨）</option>
          <option value="PERIOD_M30">30分足 確定時</option>
          <option value="PERIOD_H1">1時間足 確定時</option>
          <option value="PERIOD_D1">日足 確定時</option>
        </select>
      </div>
    </div>

    <!-- 3. エントリー条件（条件1） -->
    <div class="panel">
      <div class="panel-header">🎯 3. エントリー条件1 (RSIオシレーター)</div>
      
      <div class="form-group">
        <label>RSI 期間 (Period)</label>
        <input type="number" id="inpRsiPeriod" value="2">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>買いエントリー条件 (RSIがこの値以下で買)</label>
          <input type="number" id="inpRsiLower" value="10">
        </div>
        <div class="form-group">
          <label>売りエントリー条件 (RSIがこの値以上で売)</label>
          <input type="number" id="inpRsiUpper" value="90">
        </div>
      </div>
    </div>

    <!-- 4. 決済設定 -->
    <div class="panel">
      <div class="panel-header">🛡️ 4. 決済パラメーター設定</div>
      
      <div class="form-row">
        <div class="form-group">
          <label>利確 (Take Profit / pips)</label>
          <input type="number" id="inpTp" value="30">
        </div>
        <div class="form-group">
          <label>損切 (Stop Loss / pips)</label>
          <input type="number" id="inpSl" value="20">
        </div>
      </div>

      <button class="btn-generate" onclick="generateMQL4()">🔥 MQL4コードを生成する</button>
    </div>

    <!-- 5. コード出力エリア -->
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <div style="font-weight: bold; color: var(--accent-green);">📝 完成したMQL4ソースコード</div>
        <span id="copyStatus" style="font-size: 0.85rem; color: var(--accent-blue);"></span>
      </div>
      <textarea id="codeOutput" readonly placeholder="上の「MQL4コードを生成する」ボタンを押すとここにコードが出力されます..."></textarea>
      <button class="btn-copy" onclick="copyCode()">📋 コードをクリップボードにコピー</button>
    </div>

  </div>

  <footer>
    <p>&copy; 2026 あかとのトレードギルド (Akato Trade Guild). All rights reserved.</p>
  </footer>

  <script>
    function generateMQL4() {
      const lots = document.getElementById('inpLots').value;
      const magic = document.getElementById('inpMagic').value;
      const timeframe = document.getElementById('inpTimeframe').value;
      const period = document.getElementById('inpRsiPeriod').value;
      const upper = document.getElementById('inpRsiUpper').value;
      const lower = document.getElementById('inpRsiLower').value;
      const tp = document.getElementById('inpTp').value;
      const sl = document.getElementById('inpSl').value;

      // 判定タイミング（ティック or 確定足）の処理分け
      let timingCheckCode = "";
      let shiftVal = 1;

      if (timeframe === "PERIOD_CURRENT") {
        timingCheckCode = "   // 毎ティック判定\n";
        shiftVal = 0; // リアルタイム判定
      } else {
        timingCheckCode = `   // ローソク足確定判定 (${timeframe})\n   if(iTime(Symbol(), ${timeframe}, 0) == lastBarTime) return;\n   lastBarTime = iTime(Symbol(), ${timeframe}, 0);\n`;
        shiftVal = 1; // 確定足参照
      }

      const code = `//+------------------------------------------------------------------+
//|                                  Akato_Generated_EA.mq4          |
//|                                  あかとのトレードギルド           |
//|                                  https://akato-trade-guild.github.io/
//+------------------------------------------------------------------+
#property copyright "あかとのトレードギルド"
#property link      "https://akato-trade-guild.github.io/"
#property version   "1.00"
#property strict

// --- 基本パラメーター設定 ---
input double   InpLots          = ${lots};       // ロット数
input int      InpMagicNumber   = ${magic}; // マジックナンバー

// --- 条件1 (RSI) ---
input int      InpRSI_Period    = ${period};        // RSI期間
input double   InpRSI_Upper     = ${upper}.0;     // 売り判定閾値
input double   InpRSI_Lower     = ${lower}.0;     // 買い判定閾値

// --- 決済設定 ---
input int      InpTakeProfitPips= ${tp};       // 利確 (pips)
input int      InpStopLossPips  = ${sl};       // 損切 (pips)

datetime lastBarTime;

int OnInit()
{
   return(INIT_SUCCEEDED);
}

void OnTick()
{
${timingCheckCode}
   // 既存ポジションがある場合はスキップ
   if(OrdersTotal() > 0) return;

   // RSI値の取得
   double rsi = iRSI(Symbol(), ${timeframe === "PERIOD_CURRENT" ? "0" : timeframe}, InpRSI_Period, PRICE_CLOSE, ${shiftVal});

   // --- エントリー条件判定 ---
   // 買い判定
   if(rsi <= InpRSI_Lower)
   {
      double ask = MarketInfo(Symbol(), MODE_ASK);
      double slPrice = (InpStopLossPips > 0) ? ask - (InpStopLossPips * Point * 10) : 0;
      double tpPrice = (InpTakeProfitPips > 0) ? ask + (InpTakeProfitPips * Point * 10) : 0;
      OrderSend(Symbol(), OP_BUY, InpLots, ask, 3, slPrice, tpPrice, "Guild_EA_Buy", InpMagicNumber, 0, Blue);
   }
   // 売り判定
   else if(rsi >= InpRSI_Upper)
   {
      double bid = MarketInfo(Symbol(), MODE_SELL);
      double slPrice = (InpStopLossPips > 0) ? bid + (InpStopLossPips * Point * 10) : 0;
      double tpPrice = (InpTakeProfitPips > 0) ? bid - (InpTakeProfitPips * Point * 10) : 0;
      OrderSend(Symbol(), OP_SELL, InpLots, bid, 3, slPrice, tpPrice, "Guild_EA_Sell", InpMagicNumber, 0, Red);
   }
}`;

      document.getElementById('codeOutput').value = code;
    }

    function copyCode() {
      const codeTextarea = document.getElementById('codeOutput');
      if(!codeTextarea.value) return;

      codeTextarea.select();
      navigator.clipboard.writeText(codeTextarea.value).then(() => {
        const status = document.getElementById('copyStatus');
        status.innerText = "✓ クリップボードにコピーしました！";
        setTimeout(() => { status.innerText = ''; }, 3000);
      });
    }

    // 初期ロード時に1回生成
    window.onload = function() {
      generateMQL4();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あかとのトレードギルド | ノーコードEAジェネレーター</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --buy-color: #10b981;
      --buy-bg: rgba(16, 185, 129, 0.1);
      --sell-color: #f43f5e;
      --sell-bg: rgba(244, 63, 94, 0.1);
      --warning-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 a {
      font-size: 2rem;
      color: var(--accent-color);
      text-decoration: none;
      transition: color 0.2s, opacity 0.2s;
      display: inline-block;
      cursor: pointer;
    }

    header h1 a:hover {
      color: #7dd3fc;
      opacity: 0.9;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .panel {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    input[type="number"], select {
      background-color: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="number"]:focus, select:focus {
      border-color: var(--accent-color);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .condition-box {
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      transition: all 0.3s ease;
    }

    .condition-box.buy {
      border-color: rgba(16, 185, 129, 0.4);
      background-color: var(--buy-bg);
    }

    .condition-box.sell {
      border-color: rgba(244, 63, 94, 0.4);
      background-color: var(--sell-bg);
    }

    .condition-header {
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .condition-header.buy-title { color: var(--buy-color); }
    .condition-header.sell-title { color: var(--sell-color); }

    .condition-box.disabled .condition-content {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(1);
    }

    .indicator-child-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
    }

    .child-header {
      margin-bottom: 8px;
    }

    .empty-warning {
      background-color: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--warning-color);
      color: var(--warning-color);
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
      font-size: 0.9rem;
      display: none;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    pre {
      background-color: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      color: #e2e8f0;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      max-height: 400px;
    }

    .copy-btn {
      background-color: #334155;
      color: var(--text-main);
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 10px;
      float: right;
    }

    .copy-btn:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1><a href="https://akato-trade-guild.github.io/" target="_self">あかとのトレードギルド</a></h1>
    <p>ノーコードEAジェネレーター (Ver 2.1 - 完全同期・動作安定版)</p>
  </header>

  <!-- Step 1: 基本パラメーター -->
  <div class="panel">
    <div class="panel-title">1. 基本設定</div>
    <div class="grid-2">
      <div class="form-group">
        <label for="magicNumber">マジックナンバー</label>
        <input type="number" id="magicNumber" value="123456">
      </div>
      <div class="form-group">
        <label for="lots">ロット数</label>
        <input type="number" id="lots" value="0.1" step="0.01">
      </div>
      <div class="form-group">
        <label for="stopLoss">ストップロス (pips / 0で無効)</label>
        <input type="number" id="stopLoss" value="30">
      </div>
      <div class="form-group">
        <label for="takeProfit">テイクプロフィット (pips / 0で無効)</label>
        <input type="number" id="takeProfit" value="60">
      </div>
      <div class="form-group">
        <label for="timeframe">時間軸 (タイムフレーム)</label>
        <select id="timeframe">
          <option value="0">チャート依存 (PERIOD_CURRENT)</option>
          <option value="PERIOD_M1">1分足 (M1)</option>
          <option value="PERIOD_M5">5分足 (M5)</option>
          <option value="PERIOD_M15">15分足 (M15)</option>
          <option value="PERIOD_M30">30分足 (M30)</option>
          <option value="PERIOD_H1">1時間足 (H1)</option>
          <option value="PERIOD_H4">4時間足 (H4)</option>
          <option value="PERIOD_D1">日足 (D1)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="timing">判定タイミング</label>
        <select id="timing">
          <option value="bar">ローソク足確定時 (1号足)</option>
          <option value="tick">毎ティックリアルタイム (0号足)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Step 2: 使用インジケーター選択 -->
  <div class="panel">
    <div class="panel-title">2. 使用するインジケーター</div>
    <div class="grid-2">
      <label class="checkbox-label">
        <input type="checkbox" id="useSMA" onchange="toggleIndicatorMaster('SMA')">
        <span>SMA (単純移動平均線)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="useEMA" onchange="toggleIndicatorMaster('EMA')">
        <span>EMA (指数移動平均線)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="useIchimoku" onchange="toggleIndicatorMaster('Ichimoku')">
        <span>一目均衡表</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="useBands" onchange="toggleIndicatorMaster('Bands')">
        <span>ボリンジャーバンド</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="useDMI" onchange="toggleIndicatorMaster('DMI')">
        <span>DMI / ADX</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="useKDJ" onchange="toggleIndicatorMaster('KDJ')">
        <span>KDJ (ストキャス)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="useRSI" onchange="toggleIndicatorMaster('RSI')">
        <span>RSI (相対力指数)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="useMACD" onchange="toggleIndicatorMaster('MACD')">
        <span>MACD</span>
      </label>
    </div>
  </div>

  <!-- Step 3: エントリー条件構築 -->
  <div class="panel">
    <div class="panel-title">3. エントリー条件の設定</div>

    <!-- 🟩 買い条件ボックス -->
    <div class="condition-box buy" id="buyBox">
      <div class="condition-header buy-title">
        <label class="checkbox-label">
          <input type="checkbox" id="buyEnable" checked onchange="updateUI()">
          <span>🟩 買い（BUY）エントリー条件</span>
        </label>
      </div>

      <div class="condition-content">
        <!-- SMA (買い) -->
        <div class="indicator-child-item" id="buySmaGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="buyUseSma" checked onchange="updateUI()"><strong>SMA条件を使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>SMA期間</label><input type="number" id="buySmaPeriod" value="200"></div>
            <div class="form-group">
              <label>価格位置関係</label>
              <select id="buySmaMode">
                <option value=">">終値がSMAより上</option>
                <option value="<">終値がSMAより下</option>
              </select>
            </div>
          </div>
        </div>

        <!-- EMA (買い) -->
        <div class="indicator-child-item" id="buyEmaGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="buyUseEma" checked onchange="updateUI()"><strong>EMA条件を使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>EMA期間</label><input type="number" id="buyEmaPeriod" value="20"></div>
            <div class="form-group">
              <label>価格位置関係</label>
              <select id="buyEmaMode">
                <option value=">">終値がEMAより上</option>
                <option value="<">終値がEMAより下</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 一目均衡表 (買い) -->
        <div class="indicator-child-item" id="buyIchimokuGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="buyUseIchimoku" checked onchange="updateUI()"><strong>一目均衡表を使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>転換線 / 基準線 / 先行スパンB</label><input type="text" id="buyIchiParams" value="9, 26, 52" placeholder="9, 26, 52"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="buyIchiMode">
                <option value="cross">転換線が基準線より上</option>
                <option value="cloud">価格が雲より上</option>
              </select>
            </div>
          </div>
        </div>

        <!-- ボリンジャーバンド (買い) -->
        <div class="indicator-child-item" id="buyBandsGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="buyUseBands" checked onchange="updateUI()"><strong>ボリンジャーバンドを使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>期間 / 偏差</label><input type="text" id="buyBandsParams" value="20, 2.0" placeholder="20, 2.0"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="buyBandsMode">
                <option value="< lower">終値がLowerバンド以下 (逆張り)</option>
                <option value="> upper">終値がUpperバンド以上 (順張り)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- DMI (買い) -->
        <div class="indicator-child-item" id="buyDmiGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="buyUseDmi" checked onchange="updateUI()"><strong>DMIを使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>DMI期間</label><input type="number" id="buyDmiPeriod" value="14"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="buyDmiMode">
                <option value=">">+DI が -DI より上</option>
                <option value="<">+DI が -DI より下</option>
              </select>
            </div>
          </div>
        </div>

        <!-- KDJ (買い) -->
        <div class="indicator-child-item" id="buyKdjGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="buyUseKdj" checked onchange="updateUI()"><strong>KDJを使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>%K / %D / Slowing</label><input type="text" id="buyKdjParams" value="9, 3, 3" placeholder="9, 3, 3"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="buyKdjMode">
                <option value=">">%K が %D より上</option>
                <option value="<">%K が %D より下</option>
              </select>
            </div>
          </div>
        </div>

        <!-- RSI (買い) -->
        <div class="indicator-child-item" id="buyRsiGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="buyUseRsi" checked onchange="updateUI()"><strong>RSI条件を使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>RSI期間</label><input type="number" id="buyRsiPeriod" value="14"></div>
            <div class="form-group"><label>閾値 (レベル)</label><input type="number" id="buyRsiLevel" value="30"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="buyRsiMode">
                <option value="<=">以下で買い (逆張り)</option>
                <option value=">=">以上で買い (順張り)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- MACD (買い) -->
        <div class="indicator-child-item" id="buyMacdGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="buyUseMacd" checked onchange="updateUI()"><strong>MACDを使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Fast / Slow / Signal</label><input type="text" id="buyMacdParams" value="12, 26, 9" placeholder="12, 26, 9"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="buyMacdMode">
                <option value=">">メイン線 が シグナル線 より上</option>
                <option value="<">メイン線 が シグナル線 より下</option>
              </select>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 🟥 売り条件ボックス -->
    <div class="condition-box sell" id="sellBox">
      <div class="condition-header sell-title">
        <label class="checkbox-label">
          <input type="checkbox" id="sellEnable" checked onchange="updateUI()">
          <span>🟥 売り（SELL）エントリー条件</span>
        </label>
      </div>

      <div class="condition-content">
        <!-- SMA (売り) -->
        <div class="indicator-child-item" id="sellSmaGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="sellUseSma" checked onchange="updateUI()"><strong>SMA条件を使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>SMA期間</label><input type="number" id="sellSmaPeriod" value="200"></div>
            <div class="form-group">
              <label>価格位置関係</label>
              <select id="sellSmaMode">
                <option value="<">終値がSMAより下</option>
                <option value=">">終値がSMAより上</option>
              </select>
            </div>
          </div>
        </div>

        <!-- EMA (売り) -->
        <div class="indicator-child-item" id="sellEmaGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="sellUseEma" checked onchange="updateUI()"><strong>EMA条件を使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>EMA期間</label><input type="number" id="sellEmaPeriod" value="20"></div>
            <div class="form-group">
              <label>価格位置関係</label>
              <select id="sellEmaMode">
                <option value="<">終値がEMAより下</option>
                <option value=">">終値がEMAより上</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 一目均衡表 (売り) -->
        <div class="indicator-child-item" id="sellIchimokuGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="sellUseIchimoku" checked onchange="updateUI()"><strong>一目均衡表を使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>転換線 / 基準線 / 先行スパンB</label><input type="text" id="sellIchiParams" value="9, 26, 52" placeholder="9, 26, 52"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="sellIchiMode">
                <option value="cross">転換線が基準線より下</option>
                <option value="cloud">価格が雲より下</option>
              </select>
            </div>
          </div>
        </div>

        <!-- ボリンジャーバンド (売り) -->
        <div class="indicator-child-item" id="sellBandsGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="sellUseBands" checked onchange="updateUI()"><strong>ボリンジャーバンドを使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>期間 / 偏差</label><input type="text" id="sellBandsParams" value="20, 2.0" placeholder="20, 2.0"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="sellBandsMode">
                <option value="> upper">終値がUpperバンド以上 (逆張り)</option>
                <option value="< lower">終値がLowerバンド以下 (順張り)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- DMI (売り) -->
        <div class="indicator-child-item" id="sellDmiGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="sellUseDmi" checked onchange="updateUI()"><strong>DMIを使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>DMI期間</label><input type="number" id="sellDmiPeriod" value="14"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="sellDmiMode">
                <option value="<">+DI が -DI より下</option>
                <option value=">">+DI が -DI より上</option>
              </select>
            </div>
          </div>
        </div>

        <!-- KDJ (売り) -->
        <div class="indicator-child-item" id="sellKdjGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="sellUseKdj" checked onchange="updateUI()"><strong>KDJを使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>%K / %D / Slowing</label><input type="text" id="sellKdjParams" value="9, 3, 3" placeholder="9, 3, 3"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="sellKdjMode">
                <option value="<">%K が %D より下</option>
                <option value=">">%K が %D より上</option>
              </select>
            </div>
          </div>
        </div>

        <!-- RSI (売り) -->
        <div class="indicator-child-item" id="sellRsiGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="sellUseRsi" checked onchange="updateUI()"><strong>RSI条件を使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>RSI期間</label><input type="number" id="sellRsiPeriod" value="14"></div>
            <div class="form-group"><label>閾値 (レベル)</label><input type="number" id="sellRsiLevel" value="70"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="sellRsiMode">
                <option value=">=">以上で売り (逆張り)</option>
                <option value="<=">以下で売り (順張り)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- MACD (売り) -->
        <div class="indicator-child-item" id="sellMacdGroup" style="display: none;">
          <div class="child-header">
            <label class="checkbox-label"><input type="checkbox" id="sellUseMacd" checked onchange="updateUI()"><strong>MACDを使用する</strong></label>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Fast / Slow / Signal</label><input type="text" id="sellMacdParams" value="12, 26, 9" placeholder="12, 26, 9"></div>
            <div class="form-group">
              <label>判定</label>
              <select id="sellMacdMode">
                <option value="<">メイン線 が シグナル線 より下</option>
                <option value=">">メイン線 が シグナル線 より上</option>
              </select>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 警告表示（条件が空のとき） -->
    <div class="empty-warning" id="warningBox">
      ⚠️ 有効になっているエントリー条件の中に、選択されたインジケーターがありません。少なくとも1つのインジケーター条件にチェックを入れてください。
    </div>

    <button style="margin-top:20px;" class="btn-submit" id="generateBtn" onclick="generateEA()">MQL4コードを生成する</button>
  </div>

  <!-- Step 4: コード出力 -->
  <div class="panel">
    <button class="copy-btn" onclick="copyCode()">コードをコピー</button>
    <div class="panel-title">4. 生成されたMQL4コード</div>
    <pre><code id="mqlCode">// ここにコードが生成されます</code></pre>
  </div>
</div>

<script>
// ヘルパー：カンマ区切りパラメータを取得
function getParams(id) {
  return document.getElementById(id).value.split(',').map(s => s.trim());
}

// Masterインジケーター切り替え処理
function toggleIndicatorMaster(type) {
  const isChecked = document.getElementById('use' + type).checked;
  const buyGroup = document.getElementById('buy' + (type === 'Ichimoku' ? 'Ichimoku' : type.charAt(0).toUpperCase() + type.slice(1).toLowerCase()) + 'Group');
  const sellGroup = document.getElementById('sell' + (type === 'Ichimoku' ? 'Ichimoku' : type.charAt(0).toUpperCase() + type.slice(1).toLowerCase()) + 'Group');
  
  if(buyGroup) buyGroup.style.display = isChecked ? 'block' : 'none';
  if(sellGroup) sellGroup.style.display = isChecked ? 'block' : 'none';
  
  updateUI();
}

// UIの状態更新（ガード機能＆スタイルの反映）
function updateUI() {
  const buyEnable = document.getElementById('buyEnable').checked;
  const sellEnable = document.getElementById('sellEnable').checked;

  document.getElementById('buyBox').classList.toggle('disabled', !buyEnable);
  document.getElementById('sellBox').classList.toggle('disabled', !sellEnable);

  const indicators = ['SMA', 'EMA', 'Ichimoku', 'Bands', 'DMI', 'KDJ', 'RSI', 'MACD'];
  
  let buyHasCondition = false;
  let sellHasCondition = false;

  indicators.forEach(ind => {
    const useMaster = document.getElementById('use' + ind).checked;
    const suffix = ind === 'Ichimoku' ? 'Ichimoku' : ind.charAt(0).toUpperCase() + ind.slice(1).toLowerCase();
    if (useMaster && document.getElementById('buyUse' + suffix).checked) buyHasCondition = true;
    if (useMaster && document.getElementById('sellUse' + suffix).checked) sellHasCondition = true;
  });

  const warningBox = document.getElementById('warningBox');
  const generateBtn = document.getElementById('generateBtn');

  let isValid = true;
  if (!buyEnable && !sellEnable) isValid = false;
  if (buyEnable && !buyHasCondition) isValid = false;
  if (sellEnable && !sellHasCondition) isValid = false;

  if (!isValid) {
    warningBox.style.display = 'block';
    generateBtn.disabled = true;
  } else {
    warningBox.style.display = 'none';
    generateBtn.disabled = false;
  }
}

// MQL4コード生成ロジック
function generateEA() {
  const magic = document.getElementById('magicNumber').value;
  const lots = document.getElementById('lots').value;
  const sl = document.getElementById('stopLoss').value;
  const tp = document.getElementById('takeProfit').value;
  const tf = document.getElementById('timeframe').value;
  const timing = document.getElementById('timing').value;
  const shift = (timing === 'bar') ? '1' : '0';

  const buyEnable = document.getElementById('buyEnable').checked;
  const sellEnable = document.getElementById('sellEnable').checked;

  let buyConds = [];
  if (buyEnable) {
    if (document.getElementById('useSMA').checked && document.getElementById('buyUseSma').checked) {
      const p = document.getElementById('buySmaPeriod').value;
      const m = document.getElementById('buySmaMode').value;
      buyConds.push(`iClose(Symbol(), ${tf}, ${shift}) ${m} iMA(Symbol(), ${tf}, ${p}, 0, MODE_SMA, PRICE_CLOSE, ${shift})`);
    }
    if (document.getElementById('useEMA').checked && document.getElementById('buyUseEma').checked) {
      const p = document.getElementById('buyEmaPeriod').value;
      const m = document.getElementById('buyEmaMode').value;
      buyConds.push(`iClose(Symbol(), ${tf}, ${shift}) ${m} iMA(Symbol(), ${tf}, ${p}, 0, MODE_EMA, PRICE_CLOSE, ${shift})`);
    }
    if (document.getElementById('useIchimoku').checked && document.getElementById('buyUseIchimoku').checked) {
      const params = getParams('buyIchiParams');
      const m = document.getElementById('buyIchiMode').value;
      if (m === 'cross') {
        buyConds.push(`iIchimoku(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_TENKANSEN, ${shift}) > iIchimoku(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_KIJUNSEN, ${shift})`);
      } else {
        buyConds.push(`iClose(Symbol(), ${tf}, ${shift}) > MathMax(iIchimoku(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_SENKOUSPAN_A, ${shift}), iIchimoku(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_SENKOUSPAN_B, ${shift}))`);
      }
    }
    if (document.getElementById('useBands').checked && document.getElementById('buyUseBands').checked) {
      const params = getParams('buyBandsParams');
      const m = document.getElementById('buyBandsMode').value;
      if (m === '< lower') {
        buyConds.push(`iClose(Symbol(), ${tf}, ${shift}) < iBands(Symbol(), ${tf}, ${params[0]}, ${params[1]}, 0, PRICE_CLOSE, MODE_LOWER, ${shift})`);
      } else {
        buyConds.push(`iClose(Symbol(), ${tf}, ${shift}) > iBands(Symbol(), ${tf}, ${params[0]}, ${params[1]}, 0, PRICE_CLOSE, MODE_UPPER, ${shift})`);
      }
    }
    if (document.getElementById('useDMI').checked && document.getElementById('buyUseDmi').checked) {
      const p = document.getElementById('buyDmiPeriod').value;
      const m = document.getElementById('buyDmiMode').value;
      buyConds.push(`iADX(Symbol(), ${tf}, ${p}, PRICE_CLOSE, MODE_PLUSDI, ${shift}) ${m} iADX(Symbol(), ${tf}, ${p}, PRICE_CLOSE, MODE_MINUSDI, ${shift})`);
    }
    if (document.getElementById('useKDJ').checked && document.getElementById('buyUseKdj').checked) {
      const params = getParams('buyKdjParams');
      const m = document.getElementById('buyKdjMode').value;
      buyConds.push(`iStochastic(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_SMA, 0, MODE_MAIN, ${shift}) ${m} iStochastic(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_SMA, 0, MODE_SIGNAL, ${shift})`);
    }
    if (document.getElementById('useRSI').checked && document.getElementById('buyUseRsi').checked) {
      const p = document.getElementById('buyRsiPeriod').value;
      const l = document.getElementById('buyRsiLevel').value;
      const m = document.getElementById('buyRsiMode').value;
      buyConds.push(`iRSI(Symbol(), ${tf}, ${p}, PRICE_CLOSE, ${shift}) ${m} ${l}.0`);
    }
    if (document.getElementById('useMACD').checked && document.getElementById('buyUseMacd').checked) {
      const params = getParams('buyMacdParams');
      const m = document.getElementById('buyMacdMode').value;
      buyConds.push(`iMACD(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, PRICE_CLOSE, MODE_MAIN, ${shift}) ${m} iMACD(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, PRICE_CLOSE, MODE_SIGNAL, ${shift})`);
    }
  }

  let sellConds = [];
  if (sellEnable) {
    if (document.getElementById('useSMA').checked && document.getElementById('sellUseSma').checked) {
      const p = document.getElementById('sellSmaPeriod').value;
      const m = document.getElementById('sellSmaMode').value;
      sellConds.push(`iClose(Symbol(), ${tf}, ${shift}) ${m} iMA(Symbol(), ${tf}, ${p}, 0, MODE_SMA, PRICE_CLOSE, ${shift})`);
    }
    if (document.getElementById('useEMA').checked && document.getElementById('sellUseEma').checked) {
      const p = document.getElementById('sellEmaPeriod').value;
      const m = document.getElementById('sellEmaMode').value;
      sellConds.push(`iClose(Symbol(), ${tf}, ${shift}) ${m} iMA(Symbol(), ${tf}, ${p}, 0, MODE_EMA, PRICE_CLOSE, ${shift})`);
    }
    if (document.getElementById('useIchimoku').checked && document.getElementById('sellUseIchimoku').checked) {
      const params = getParams('sellIchiParams');
      const m = document.getElementById('sellIchiMode').value;
      if (m === 'cross') {
        sellConds.push(`iIchimoku(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_TENKANSEN, ${shift}) < iIchimoku(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_KIJUNSEN, ${shift})`);
      } else {
        sellConds.push(`iClose(Symbol(), ${tf}, ${shift}) < MathMin(iIchimoku(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_SENKOUSPAN_A, ${shift}), iIchimoku(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_SENKOUSPAN_B, ${shift}))`);
      }
    }
    if (document.getElementById('useBands').checked && document.getElementById('sellUseBands').checked) {
      const params = getParams('sellBandsParams');
      const m = document.getElementById('sellBandsMode').value;
      if (m === '< lower') {
        sellConds.push(`iClose(Symbol(), ${tf}, ${shift}) < iBands(Symbol(), ${tf}, ${params[0]}, ${params[1]}, 0, PRICE_CLOSE, MODE_LOWER, ${shift})`);
      } else {
        sellConds.push(`iClose(Symbol(), ${tf}, ${shift}) > iBands(Symbol(), ${tf}, ${params[0]}, ${params[1]}, 0, PRICE_CLOSE, MODE_UPPER, ${shift})`);
      }
    }
    if (document.getElementById('useDMI').checked && document.getElementById('sellUseDmi').checked) {
      const p = document.getElementById('sellDmiPeriod').value;
      const m = document.getElementById('sellDmiMode').value;
      sellConds.push(`iADX(Symbol(), ${tf}, ${p}, PRICE_CLOSE, MODE_PLUSDI, ${shift}) ${m} iADX(Symbol(), ${tf}, ${p}, PRICE_CLOSE, MODE_MINUSDI, ${shift})`);
    }
    if (document.getElementById('useKDJ').checked && document.getElementById('sellUseKdj').checked) {
      const params = getParams('sellKdjParams');
      const m = document.getElementById('sellKdjMode').value;
      sellConds.push(`iStochastic(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_SMA, 0, MODE_MAIN, ${shift}) ${m} iStochastic(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, MODE_SMA, 0, MODE_SIGNAL, ${shift})`);
    }
    if (document.getElementById('useRSI').checked && document.getElementById('sellUseRsi').checked) {
      const p = document.getElementById('sellRsiPeriod').value;
      const l = document.getElementById('sellRsiLevel').value;
      const m = document.getElementById('sellRsiMode').value;
      sellConds.push(`iRSI(Symbol(), ${tf}, ${p}, PRICE_CLOSE, ${shift}) ${m} ${l}.0`);
    }
    if (document.getElementById('useMACD').checked && document.getElementById('sellUseMacd').checked) {
      const params = getParams('sellMacdParams');
      const m = document.getElementById('sellMacdMode').value;
      sellConds.push(`iMACD(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, PRICE_CLOSE, MODE_MAIN, ${shift}) ${m} iMACD(Symbol(), ${tf}, ${params[0]}, ${params[1]}, ${params[2]}, PRICE_CLOSE, MODE_SIGNAL, ${shift})`);
    }
  }

  const buyLogicStr = (buyConds.length > 0) ? buyConds.join(" && \n       ") : "false";
  const sellLogicStr = (sellConds.length > 0) ? sellConds.join(" && \n       ") : "false";

  const code = `//+------------------------------------------------------------------+
//|                                  AkatoTradeGuild_EA.mq4          |
//|        Generated by あかとのトレードギルド                       |
//+------------------------------------------------------------------+
#property copyright "Akato Trade Guild"
#property strict

input double    InpLots        = ${lots};      // ロット数
input int       InpStopLoss    = ${sl};        // ストップロス (pips)
input int       InpTakeProfit  = ${tp};        // テイクプロフィット (pips)
input int       InpMagicNumber = ${magic};   // マジックナンバー

datetime g_lastBarTime = 0;

int OnInit() {
   return(INIT_SUCCEEDED);
}

void OnDeinit(const int reason) {}

void OnTick() {
   ${timing === 'bar' ? `
   // ローソク足確定の判定 (指定タイムフレームの確定足)
   datetime currentBarTime = iTime(Symbol(), ${tf}, 0);
   if(g_lastBarTime == currentBarTime) return;
   g_lastBarTime = currentBarTime;
   ` : ''}

   // ポジションチェック（既にポジションがある場合は処理スキップ）
   if(CountMyOrders() > 0) return;

   double point = MarketInfo(Symbol(), MODE_POINT);
   int digits = (int)MarketInfo(Symbol(), MODE_DIGITS);
   double pipsFactor = (digits == 3 || digits == 5) ? 10.0 : 1.0;

   // エントリー条件判定
   bool isBuy  = ${buyLogicStr};
   bool isSell = ${sellLogicStr};

   // 買い注文処理
   if(isBuy) {
      double slPrice = (InpStopLoss > 0) ? NormalizeDouble(Ask - (InpStopLoss * point * pipsFactor), Digits) : 0;
      double tpPrice = (InpTakeProfit > 0) ? NormalizeDouble(Ask + (InpTakeProfit * point * pipsFactor), Digits) : 0;
      int ticket = OrderSend(Symbol(), OP_BUY, InpLots, Ask, 3, slPrice, tpPrice, "ATG EA BUY", InpMagicNumber, 0, clrGreen);
      if(ticket < 0) {
         Print("BUY注文失敗 Error: ", GetLastError());
      }
   }
   // 売り注文処理
   else if(isSell) {
      double slPrice = (InpStopLoss > 0) ? NormalizeDouble(Bid + (InpStopLoss * point * pipsFactor), Digits) : 0;
      double tpPrice = (InpTakeProfit > 0) ? NormalizeDouble(Bid - (InpTakeProfit * point * pipsFactor), Digits) : 0;
      int ticket = OrderSend(Symbol(), OP_SELL, InpLots, Bid, 3, slPrice, tpPrice, "ATG EA SELL", InpMagicNumber, 0, clrRed);
      if(ticket < 0) {
         Print("SELL注文失敗 Error: ", GetLastError());
      }
   }
}

// 自身のマジックナンバーのポジション数をカウント
int CountMyOrders() {
   int count = 0;
   for(int i = OrdersTotal() - 1; i >= 0; i--) {
      if(OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) {
         if(OrderSymbol() == Symbol() && OrderMagicNumber() == InpMagicNumber) {
            count++;
         }
      }
   }
   return count;
}`;

  document.getElementById('mqlCode').textContent = code;
}

// コードコピー機能
function copyCode() {
  const codeText = document.getElementById('mqlCode').textContent;
  navigator.clipboard.writeText(codeText).then(() => {
    alert('MQL4コードをクリップボードにコピーしました！');
  });
}

// ページ初期化
window.addEventListener('DOMContentLoaded', () => {
  ['SMA', 'EMA', 'Ichimoku', 'Bands', 'DMI', 'KDJ', 'RSI', 'MACD'].forEach(ind => {
    toggleIndicatorMaster(ind);
  });
  generateEA();
});
</script>

</body>
</html>
